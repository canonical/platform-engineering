[project]
name = "terraform-compliance"
version = "0.1.0"
description = "Generic Terraform module compliance checker enforcing a configurable spec (default: CC008)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["python-hcl2==8.1.4"]

[project.scripts]
terraform-compliance = "terraform_compliance.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terraform_compliance"]
