[project]
name = "validate-jira-sync-config"
version = "0.1.0"
description = "Validate a gh-jira-sync-bot .jira_sync_config.yaml file"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml", "typer"]

[project.scripts]
validate-jira-sync-config = "validate_jira_sync_config.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validate_jira_sync_config"]
