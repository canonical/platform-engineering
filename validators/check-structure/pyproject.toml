[project]
name = "pfe-check-structure"
version = "0.1.0"
description = "Check the structure of skills and KB entries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
pfe-check-structure = "check_structure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/check_structure"]
