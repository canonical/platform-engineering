name: Validators release

on:
  pull_request:
  push:
    branches: [main]
    paths: [validators/**]

permissions:
  contents: read

jobs:
  version-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - name: Lockfile is up to date
        run: uv lock --check --project validators
      - name: Validator versions are bumped
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: uv run --with packaging .github/scripts/validators_version.py check "$BASE_REF"

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - name: Tag new versions
        id: tag
        run: |
          created=$(uv run --with packaging .github/scripts/validators_version.py tag)
          {
            echo "created<<EOF"
            echo "$created"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.tag.outputs.created }}
        run: |
          for t in $CREATED; do
            gh release create "$t" --verify-tag --title "$t" --generate-notes
          done
