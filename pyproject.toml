[project]
name = "platform-engineering-validators"
version = "0.1.0"
description = "Platform Engineering practice validators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
pfe-check-structure = "validators.check_structure:main"

[dependency-groups]
dev = ["pytest", "ruff", "codespell", "yamllint"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validators"]

[tool.ruff]
line-length = 99
extend-exclude = ["templates/*/template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"validators/tests/*" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["validators/tests"]

[tool.codespell]
skip = "./.git,./.venv,./uv.lock,./templates/*/template/uv.lock"
