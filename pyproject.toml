# uv workspace root. This project is not published; it only ties the
# workspace members together for development and CI.
[project]
name = "platform-engineering-practices"
version = "0.0.0"
description = "Workspace root for Platform Engineering practices, validators and tooling"
requires-python = ">=3.10"
dependencies = [
    "pfe-validators-common",
    "check-todos",
    "check-devenv",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["compliance/common", "compliance/validators/*"]
exclude = ["compliance/validators/_template"]

[tool.uv.sources]
pfe-validators-common = { workspace = true }
check-todos = { workspace = true }
check-devenv = { workspace = true }

[tool.ruff]
line-length = 99
target-version = "py310"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
src = ["compliance/common/src", "compliance/validators/*/src"]
# The vendored templates have their own tooling and configuration.
extend-exclude = ["compliance/validators/*/tests/fixtures", "templates"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "D", "N", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["compliance/common/src", "compliance/validators/[!_]*/src"]
exclude = ["/tests/fixtures/", "compliance/validators/_template/"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["compliance"]
norecursedirs = ["fixtures", "_template", ".venv"]
